public = true
note = """All 18 skills present on 2026-10-14, listed by name so later upstream additions stay out. \
Nine duplicates of existing workflows are off. pstack calls control-cli, control-ui and deslop by name."""

[source]
build = "generic"
repository = "https://github.com/cursor/plugins.git"
commit = "1e5c90a4b6f249917bd21fe361b3a2a7deb741b8"
subdirectory = "cursor-team-kit"
manifest = ".cursor-plugin/plugin.json"
packaging = 2
display_name = "Cursor Team Kit"
select = [
  "check-compiler-errors", "control-cli", "control-ui", "deslop", "fix-ci", "fix-merge-conflicts",
  "get-pr-comments", "loop-on-ci", "make-pr-easy-to-review", "new-branch-and-pr", "pr-review-canvas",
  "review-and-ship", "run-smoke-tests", "thermo-nuclear-code-quality-review", "verify-this",
  "weekly-review", "what-did-i-get-done", "workflow-from-chats",
]

[skills]
off = [
  "check-compiler-errors", "fix-ci", "fix-merge-conflicts", "get-pr-comments", "loop-on-ci",
  "new-branch-and-pr", "review-and-ship", "run-smoke-tests", "workflow-from-chats",
]
explicit = [
  "control-cli", "control-ui", "deslop", "make-pr-easy-to-review",
  "pr-review-canvas", "thermo-nuclear-code-quality-review", "verify-this",
]

[codex]
install = [{ via = "personal", enabled = true }]

[claude]
install = [{ via = "codex-aligned", enabled = true, agents = [] }]

[claude.skills]
explicit = ["fix-ci"]
