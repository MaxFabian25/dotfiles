# Runs the test suite on every push, so a failure shows up when it is pushed instead of on a device.
name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # Windows waits on a test pass: fixtures still write CRLF text, backslash paths in TOML strings and
        # 8.3 temp paths, which fail 84 tests there although the engine itself runs on Windows devices.
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          python-version: "3.14"
      - run: uv run --locked python -B -m unittest discover -s tests
