# Runs the test suite on every push, so a failure shows up when it is pushed instead of on a device.
name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          python-version: "3.14"
      # skill_draft.py's tests need a private user namespace, which Ubuntu 24.04 refuses to unprivileged programs
      # while this setting is on. The suite's "Skipped tests:" line names test_skill_draft.py when they did not run.
      - if: runner.os == 'Linux'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      # The runner points CODEX_HOME and CLAUDE_CONFIG_DIR at a missing folder, so tests that
      # resolve device roots never read real config.
      - run: uv run --locked python -B tests/run.py
      # The engine's .sync folder is the cache real pulls use, so no test may write into the checkout's copy.
      - run: test ! -e .sync || { echo "::error::the tests wrote into .sync"; exit 1; }
        shell: bash

  # The Prose plugin's own suites, on the oldest and newest Python its pyproject.toml supports.
  # The Markdown linter needs Node, so lint runs on the newest leg only.
  prose:
    name: prose (${{ matrix.python-version }})
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.14"]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: packages/prose
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          python-version: ${{ matrix.python-version }}
      - if: matrix.python-version == '3.14'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: packages/prose/package-lock.json
      - if: matrix.python-version == '3.14'
        run: make lint
      - run: make test validate eval-test
