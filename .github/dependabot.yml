version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 1
  - package-ecosystem: uv
    directories:
      - /
      - /packages/prose
    schedule:
      interval: weekly
    cooldown:
      default-days: 1
  - package-ecosystem: npm
    directory: /packages/prose
    schedule:
      interval: weekly
    cooldown:
      default-days: 1
