public = true
note = "All 18 skills present on 2026-10-14 are selected so later upstream additions are not exported. Disabled skills are listed below; Claude's aligned copy omits them. No harness adaptation: only pr-review-canvas mentions an in-app browser, which both hosts handle as written. Invocation choices are recorded below."

[source]
build = "generic"
repository = "https://github.com/cursor/plugins.git"
commit = "e5136d82418d2db3165ea1050d17577cd618cc05"
subdirectory = "cursor-team-kit"
manifest = ".cursor-plugin/plugin.json"
packaging = 2
display_name = "Cursor Team Kit"
select = [
  "./skills/check-compiler-errors",
  "./skills/control-cli",
  "./skills/control-ui",
  "./skills/deslop",
  "./skills/fix-ci",
  "./skills/fix-merge-conflicts",
  "./skills/get-pr-comments",
  "./skills/loop-on-ci",
  "./skills/make-pr-easy-to-review",
  "./skills/new-branch-and-pr",
  "./skills/pr-review-canvas",
  "./skills/review-and-ship",
  "./skills/run-smoke-tests",
  "./skills/thermo-nuclear-code-quality-review",
  "./skills/verify-this",
  "./skills/weekly-review",
  "./skills/what-did-i-get-done",
  "./skills/workflow-from-chats",
]

[source.metadata]
url = "https://github.com/cursor/plugins/tree/main/cursor-team-kit"

[skills]
off = [
  "run-smoke-tests",
  "weekly-review",
  "what-did-i-get-done",
  "workflow-from-chats",
]
explicit = [
  "control-cli",
  "control-ui",
  "deslop",
  "make-pr-easy-to-review",
  "new-branch-and-pr",
  "pr-review-canvas",
  "review-and-ship",
  "thermo-nuclear-code-quality-review",
  "verify-this",
]

[codex]
install = [{ via = "personal", enabled = true }]

[claude]
install = [{ via = "codex-aligned", enabled = true, agents = [] }]
