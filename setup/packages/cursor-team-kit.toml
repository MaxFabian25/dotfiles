public = true
note = "All 18 skills present on 2026-10-14, listed by name so later upstream additions are not exported. Duplicates of existing workflows are disabled by name in Codex skills.config, and Claude's aligned copy omits them: check-compiler-errors, fix-ci, fix-merge-conflicts, get-pr-comments, loop-on-ci, new-branch-and-pr, review-and-ship, run-smoke-tests, workflow-from-chats. No harness adaptation: only pr-review-canvas mentions an in-app browser, which both hosts handle as written. Invocation flags live in invocation-overrides.json explicitTargets."

[source]
build = "generic"
repository = "https://github.com/cursor/plugins.git"
commit = "e5136d82418d2db3165ea1050d17577cd618cc05"
subdirectory = "cursor-team-kit"
manifest = ".cursor-plugin/plugin.json"
packaging = 2
display_name = "Cursor Team Kit"
select = [
  "./skills/check-compiler-errors",
  "./skills/control-cli",
  "./skills/control-ui",
  "./skills/deslop",
  "./skills/fix-ci",
  "./skills/fix-merge-conflicts",
  "./skills/get-pr-comments",
  "./skills/loop-on-ci",
  "./skills/make-pr-easy-to-review",
  "./skills/new-branch-and-pr",
  "./skills/pr-review-canvas",
  "./skills/review-and-ship",
  "./skills/run-smoke-tests",
  "./skills/thermo-nuclear-code-quality-review",
  "./skills/verify-this",
  "./skills/weekly-review",
  "./skills/what-did-i-get-done",
  "./skills/workflow-from-chats",
]

[source.metadata]
url = "https://github.com/cursor/plugins/tree/main/cursor-team-kit"

[skills]
off = [
  "check-compiler-errors",
  "fix-ci",
  "fix-merge-conflicts",
  "get-pr-comments",
  "loop-on-ci",
  "new-branch-and-pr",
  "review-and-ship",
  "run-smoke-tests",
  "workflow-from-chats",
]
explicit = [
  "control-cli",
  "control-ui",
  "deslop",
  "make-pr-easy-to-review",
  "pr-review-canvas",
  "thermo-nuclear-code-quality-review",
  "verify-this",
]

[codex]
install = [{ via = "personal", enabled = true }]

[claude]
install = [{ via = "codex-aligned", enabled = true, agents = [] }]
