public = true

[source]
repo = "impeccable"
path = "plugin"

[skills]
tool_notes = "apply"

[codex]
install = [{ via = "personal", enabled = true }]
hooks = "trusted"
windows_hook_command = 'cmd /c if exist "${CLAUDE_PLUGIN_ROOT}\skills\impeccable\scripts\impeccable.cmd" "${CLAUDE_PLUGIN_ROOT}\skills\impeccable\scripts\impeccable.cmd" hook'

[[codex.windows_replace]]
path = 'skills/impeccable/scripts/impeccable.cmd'
find = '''where curl.exe >nul 2>nul'''
replace = '''echo impeccable: no engine found, and this setup never downloads one on Windows; install the pinned npm:impeccable with mise. 1>&2 & exit /b 1'''


[[codex.windows_replace]]
path = 'skills/impeccable/scripts/impeccable'
find = '''if [ -n "$version" ] && [ "$os" != unknown ] && [ "$arch" != unknown ]; then'''
replace = '''echo "impeccable: this setup never downloads an engine on Windows; install the pinned npm:impeccable with mise." >&2
exit 1
if [ -n "$version" ] && [ "$os" != unknown ] && [ "$arch" != unknown ]; then'''


[claude]
install = [{ via = "impeccable", enabled = true }]


[[claude.windows_replace]]
path = 'skills/impeccable/scripts/impeccable.cmd'
find = '''where curl.exe >nul 2>nul'''
replace = '''echo impeccable: no engine found, and this setup never downloads one on Windows; install the pinned npm:impeccable with mise. 1>&2 & exit /b 1'''


[[claude.windows_replace]]
path = 'skills/impeccable/scripts/impeccable'
find = '''if [ -n "$version" ] && [ "$os" != unknown ] && [ "$arch" != unknown ]; then'''
replace = '''echo "impeccable: this setup never downloads an engine on Windows; install the pinned npm:impeccable with mise." >&2
exit 1
if [ -n "$version" ] && [ "$os" != unknown ] && [ "$arch" != unknown ]; then'''

[[codex.replace]]
path = 'skills/impeccable/reference/live.md'
find = '''drop both, pass `--query`'''
replace = '''drop both; keep separate `--tag` and `--text`'''

[[codex.replace]]
path = 'skills/impeccable/reference/live.md'
find = '''A tag alone never lands on the first match: when the tag repeats and `--text` does not single out one element, or the element shares a source line with other markup (`reason: "shared_line"`), wrap exits `element_ambiguous`; follow the fallback flow as above.'''
replace = '''When the tag repeats and `--text` does not single out one element, wrap exits `element_ambiguous`; follow the fallback flow as above. If wrap reports `reason: "shared_line"`, use that same fallback; sharing a line does not always prevent a wrap (engine 0.1.24 normalised a plain-HTML fixture on 14 November 2026).'''

# Impeccable's four agents run as built-in agents at a pstack seat, as pstack's roles do (user, 2026-11-14), so the
# plugin's agent types stay out of every session's agent list: Claude's settings deny them and Codex gets no role files.
[[codex.replace]]
path = 'skills/impeccable/reference/live.md'
find = '''delegate source edits to `impeccable_manual_edit_applier` / `impeccable-manual-edit-applier`.'''
replace = '''delegate source edits to a built-in agent: `general-purpose` in Claude Code, or `spawn_agent` with no `agent_type` and with `fork_turns` `none` in Codex, at the model and effort of the first seat on the `feature, refactoring` line in your harness's section of `~/.config/pstack/models.md` (a seat reads `model@effort`; skip one prefixed `codex:` or `claude:`). Begin its brief with "Read PATH, skip its frontmatter and follow the rest.", where PATH is the absolute path of `agents/impeccable-manual-edit-applier.md` in this plugin's root, two folders above this skill's folder.'''

[[codex.replace]]
path = 'skills/impeccable/reference/new-work-comp.md'
find = '''spawn the shipped asset producer (`impeccable-asset-producer`; `impeccable_asset_producer` in codex; `/impeccable-asset-producer` in Cursor; on GitHub Copilot say "Use the impeccable-asset-producer agent") with the spec path and let it produce them all;'''
replace = '''spawn the asset producer as a built-in agent: `general-purpose` in Claude Code, or `spawn_agent` with no `agent_type` and with `fork_turns` `none` in Codex, at the model and effort of the first seat on the `feature, refactoring` line in your harness's section of `~/.config/pstack/models.md` (a seat reads `model@effort`; skip one prefixed `codex:` or `claude:`). Begin its brief with "Read PATH, skip its frontmatter and follow the rest. `${CLAUDE_PLUGIN_ROOT}` in it means ROOT, and its links are relative to its folder.", where ROOT is the absolute path of this plugin's root, two folders above this skill's folder, and PATH is ROOT's `agents/impeccable-asset-producer.md`. Give it the spec path and let it produce them all;'''

[[codex.replace]]
path = 'skills/impeccable/reference/new-work.md'
find = '''Then spawn the shipped finish reviewer, `impeccable-finish-reviewer` (`impeccable_finish_reviewer` in codex; `/impeccable-finish-reviewer` in Cursor; on GitHub Copilot say "Use the impeccable-finish-reviewer agent"), with'''
replace = '''Then spawn the finish reviewer as a built-in agent: `general-purpose` in Claude Code, or `spawn_agent` with no `agent_type` and with `fork_turns` `none` in Codex, at the model and effort of the first seat on the `judgment and prose` line in your harness's section of `~/.config/pstack/models.md` (a seat reads `model@effort`; skip one prefixed `codex:` or `claude:`). Begin its brief with "Read PATH, skip its frontmatter and follow the rest. Do not edit, write or delete any file.", where PATH is the absolute path of `agents/impeccable-finish-reviewer.md` in this plugin's root, two folders above this skill's folder. Then give it'''

[[codex.replace]]
path = 'skills/impeccable/reference/new-work.md'
find = '''Never read the shipped agents' definition files before spawning; the harness loads them at spawn, and you owe only the input packet.'''
replace = '''Never read the agent's file yourself before spawning; the agent reads it, and you owe only the input packet.'''

