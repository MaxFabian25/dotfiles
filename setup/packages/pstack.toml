[codex]
install = [{ via = "personal", enabled = true }]
adaptation = { repository = "https://github.com/MaxFabian25/pstack-harness-adaptations.git", base = "1de6049845e4c27684fdfb439b6551a47523483a", adapted = "c6abaaec590ef28bf9849ce2372f91c2dc8e6e4f", harness = "skills/poteto-mode/references/harnesses.md" }

# Text changes that name a skill outside pstack sit here, because other users of the adaptation lack those skills:
# two of the three ideas the user chose from Matt Pocock's skills on 2026-11-15 (hard bugs built to the owned
# diagnosing-bugs skill's loop, writing-for-agents beside skill authoring) and unslop deferring to the prose skill.
# On 2026-11-21 the user chose to move the changes that name no other skill, such as questions asked in rounds
# (Matt's grilling), into the adaptation itself. The user's reflect rules of 2026-11-14 and 2026-11-15 (a finding's text and check in one row, and the environment lens)
# ended with Pstack 0.15.43, whose single-pass reflect the user took as upstream wrote it on 2026-11-17.
[[codex.replace]]
path = 'skills/poteto-mode/playbooks/bug-fix.md'
find = '''Trace every caller and the arguments it passes before you call the flagged code reachable or unreachable.'''
replace = '''Trace every caller and the arguments it passes before you call the flagged code reachable or unreachable. When the bug resists a first look, comes and goes, or appeared between two known states, build the loop to the **diagnosing-bugs** skill's Phase 1 completion criterion, one command you have already run that goes red on this bug, and minimise the repro per its Phase 2 before step 2.'''

[[codex.replace]]
path = 'skills/poteto-mode/playbooks/authoring-a-skill.md'
find = '''1. Use the authoring route in [harnesses.md](../references/harnesses.md) (Skill authoring and description tuning).'''
replace = '''1. Use the authoring route in [harnesses.md](../references/harnesses.md) (Skill authoring and description tuning), and word the text per the **writing-for-agents** skill.'''

[[codex.replace]]
path = 'skills/poteto-mode/SKILL.md'
find = '''- Prose, your reply included → **unslop**.'''
replace = '''- Prose, your reply included → **unslop**. Agent-facing prose, such as a skill or agent instructions, also follows the **writing-for-agents** skill.'''

[[codex.replace]]
path = 'skills/unslop/SKILL.md'
find = '''Scan for the patterns below, then rewrite. Preserve meaning and match the intended tone.'''
replace = '''Scan for the patterns below, then rewrite. Preserve meaning and match the intended tone. When the **prose** skill or a project style guide is active, follow it for punctuation, quotation marks, headings, and register.'''

[[codex.replace]]
path = 'skills/reframe/SKILL.md'
find = '''Teach the expert words for what the operator is building, borrow words from neighboring fields that solved the same problem, then rewrite their description with them. Use for /reframe.'''
replace = '''Use when the user asks what an unfamiliar problem is called, how experts frame it, or which terms to search for. Check examples across fields and rewrite their description with the terms that fit.'''

[[codex.replace]]
path = 'skills/typescript-best-practices/SKILL.md'
find = '''description: TypeScript best practices. Use when reading or editing any .ts or .tsx file.'''
replace = '''description: TypeScript best practices. Use when writing, editing, or reviewing .ts or .tsx code.'''

[[codex.replace]]
path = 'skills/typescript-best-practices/SKILL.md'
find = '''| Discriminated unions | Model variants with a `kind` literal discriminant so impossible states can't be represented. No optional-field bags. |
| Branded types | Brand primitives with `& { readonly __brand: "X" }` so they can't be mixed up. Validate once at the boundary. A brand comes from a verifying type guard (`input is AgentId`), never from `as`. |'''
replace = '''| Discriminated unions | Model variants with a literal discriminant (`_tag` via `Schema.TaggedStruct`, `Schema.TaggedUnion`, or `Data.TaggedEnum` in Effect 4 repositories; `kind` elsewhere) so impossible states can't be represented. No optional-field bags. |
| Branded types | Brand primitives so they can't be mixed up and validate once at the boundary. In Effect 4 repositories, use `Schema.brand`; elsewhere, use `& { readonly __brand: "X" }` with a verifying type guard (`input is AgentId`), never `as`. |'''

[[codex.replace]]
path = 'skills/typescript-best-practices/SKILL.md'
find = '''| Schemas before guards | Before hand-writing a property-by-property type guard, use the repository's runtime schema library and infer the type from the schema, such as `z.infer`. |'''
replace = '''| Schemas before guards | Before hand-writing a property-by-property type guard, use the repository's runtime schema library and infer the type from the schema. In Effect 4 repositories, prefer Effect `Schema` (`Schema.Struct`, `Schema.brand`, `Schema.TaggedError`, `Schema.TaggedUnion`, `Data.TaggedEnum`) with `{ onExcessProperty: "error" }` at strict boundaries instead of Zod or throwing parsers. |'''

[[codex.replace]]
path = 'skills/typescript-best-practices/SKILL.md'
find = '''| Narrowing hierarchy | Discriminant switch > `in` operator > `typeof`/`instanceof` > user-defined type guard > `as`. |
| Type guards | Must verify the claim. A lying guard is worse than `as` because the bug hides behind a name that says it's safe. Name them `isX` or `hasX`. |
| Exhaustiveness | Inline `const _exhaustive: never = x;` in default arms so the compiler errors when a new variant is added. |
| `satisfies` over `as` | Validates the value without widening literal types. |
| Boundary validation | Parse where data crosses in, into a named domain type. `Record<string, unknown>` (however spelled) stops at that parse. Trust types inside. See the **boundary-discipline** principle skill. |'''
replace = '''| Narrowing hierarchy | Discriminant dispatch (`Match.value` / `$match` / `Predicate.isTagged` in Effect 4; `switch` elsewhere) > `in` operator > `typeof`/`instanceof` > user-defined type guard > `as`. |
| Type guards | Must verify the claim. A lying guard is worse than `as` because the bug hides behind a name that says it's safe. Name them `isX` or `hasX`. |
| Exhaustiveness | Use `Match.tagsExhaustive` or `$match` on `_tag` unions in Effect 4 (do not `switch` on `_tag`); elsewhere, inline `const _exhaustive: never = x;` in default arms so the compiler errors on new variants. |
| `satisfies` over `as` | Validates the value without widening literal types. |
| Boundary validation | Parse where data crosses in, into a named domain type. `Record<string, unknown>` (however spelled) stops at that parse. In Effect 4, decode with `Schema` (`{ onExcessProperty: "error" }` at strict boundaries, `Schema.fromJsonString` for JSON instead of `try/catch`). Trust types inside. See the **boundary-discipline** principle skill. |'''

[[codex.replace]]
path = 'skills/typescript-best-practices/references/patterns.md'
find = '''Code examples for each rule in `SKILL.md`. The underlying principles are language-agnostic. See the **type-system-discipline** and **boundary-discipline** principle skills.'''
replace = '''Code examples for each rule in `SKILL.md`. The underlying principles are language-agnostic. See the **type-system-discipline** and **boundary-discipline** principle skills.

> **Effect 4 repositories:** Use `_tag` (`Schema.TaggedStruct`, `Schema.TaggedUnion`, `Data.TaggedEnum`) instead of `kind`, `Schema.brand` instead of manual `__brand` guards, `Match.value` / `Match.tagsExhaustive` / `$match` instead of `switch` on `_tag`, `Schema` with `{ onExcessProperty: "error" }` instead of Zod or `ignoreUnknownFields`, `DateTime` instead of `Date`, and `Schema.fromJsonString` instead of `try/catch` inside Effect code.'''

[[codex.replace]]
path = 'agents/codex/poteto-agent.toml'
find = '''If more than one file matches, use the copy whose `.codex-plugin/plugin.json` has the highest `version`.'''
replace = '''If more than one file matches, use the copy whose `.codex-plugin/plugin.json` has the highest `version`; if multiple version folders share the same manifest `version`, pick the folder Codex loads: the one whose folder name sorts last in Codex's version order (for dotfiles-managed folders, the latest `notes.<UTC time>`).'''

[[codex.replace]]
path = 'agents/poteto-agent.md'
find = '''If more than one file matches, use the copy whose plugin manifest (`.claude-plugin/plugin.json` in Claude Code, `.codex-plugin/plugin.json` in Codex) has the highest `version`.'''
replace = '''If more than one file matches, use the copy whose plugin manifest (`.claude-plugin/plugin.json` in Claude Code, `.codex-plugin/plugin.json` in Codex) has the highest `version`; if multiple folders share that `version`, pick the folder the host loads (for dotfiles-managed folders, the latest `notes.<UTC time>`).'''

