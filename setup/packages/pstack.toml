[codex]
install = [{ via = "personal", enabled = true }]
adaptation = { repository = "https://github.com/MaxFabian25/pstack-harness-adaptations.git", base = "c8d2305bea0c541dbc76d38efa2a7af1c9ebba67", adapted = "51231a47f1c98730b82c19f8699814ca757de333", harness = "skills/poteto-mode/references/harnesses.md" }

# Reflect keeps a finding's text and its check in one row, so a cheap check ships in the same release as its text
# (user, 2026-11-14), after the 13 November pass split 43 rows into a text part and a check left in an issue.
# These are the user's own rules, so they sit here rather than in the adaptation, which maps harnesses.
[[codex.replace]]
path = 'skills/reflect/SKILL.md'
find = '''Move any Accepted item that a lint rule, script, metadata flag, or runtime check would enforce more reliably to Backlog. See the **encode-lessons-in-structure** principle skill.'''
replace = '''Read each Accepted row's Check cell, which `references/synthesizer.md` defines. A row with a cheap check ships that check and its test in the same release as its text, so the user approves both at once. When that release cannot carry the check, the text waits for it, and the whole row goes to Backlog as one item. A row whose check is not cheap stays text-only, and its Check cell names the check and why it does not fit. Keep each finding's text and check in one row. On 13 November 2026 a pass instead split 43 rows into a text part and a check part that went into an issue or an issue comment, and a day later 25 of the 26 issues that name a text half or an Accepted row were still open. See the **encode-lessons-in-structure** principle skill.'''

[[codex.replace]]
path = 'skills/reflect/references/synthesizer.md'
find = '''- Structural-mechanism check: route to Backlog when a lint rule, script, metadata flag, or runtime check already enforces the rule or could enforce it cheaply. Skill prose is for things mechanisms cannot enforce.'''
replace = '''- Structural-mechanism check: when a lint rule, script, metadata flag, or runtime check already enforces the rule, reject the finding as `already-covered`, or make fixing that check the row's edit when it failed to fire. When one could enforce the rule cheaply, make that check the row's edit, with only the text it still needs beside it, and name the check and its test in the row's Check cell. Cheap means the check and its test fit in the release that carries the row's text, such as a pattern in an existing hook, a new hook or script with its test, an assertion in an existing test, or a lint over files the release already changes, even when the check reaches only one harness. Otherwise write `none:` in the Check cell, then the check that would enforce the rule and why it does not fit, such as a tool that needs its own design or release, a CI job the repository lacks, a change on another machine or upstream, or a judgment no check can make, and keep the row text-only. One finding is one row, so its text and its check ship together.'''

[[codex.replace]]
path = 'skills/reflect/references/synthesizer.md'
find = '''Accept the finding in a stronger form, such as a hook, script or check in Backlog, and name the earlier row in its Problem.'''
replace = '''Accept the finding in a stronger form, such as a hook, script or check that ships as the row's edit, and name the earlier row in its Problem.'''

[[codex.replace]]
path = 'skills/reflect/references/synthesizer.md'
find = '''| Problem | Proposal | Routing |
|---|---|---|
| <failure mode in a skill the parent used> | <change to that skill's body> | <skill path + section> |
| <skill existed but didn't trigger> | <tune the skill's description so it fires next time> | <tune description: <skill path>> |
| <new pattern, no existing skill is a real home> | <draft a new skill via skill-creator> | <new skill via skill-creator: <kebab-name>> |'''
replace = '''| Problem | Proposal | Routing | Check |
|---|---|---|---|
| <failure mode in a skill the parent used> | <change to that skill's body> | <skill path + section> | <the check and its test, or `none:`, the check that would enforce the rule and why it does not fit> |
| <skill existed but didn't trigger> | <tune the skill's description so it fires next time> | <tune description: <skill path>> | <the check and its test, or `none:`, the check that would enforce the rule and why it does not fit> |
| <new pattern, no existing skill is a real home> | <draft a new skill via skill-creator> | <new skill via skill-creator: <kebab-name>> | <the check and its test, or `none:`, the check that would enforce the rule and why it does not fit> |'''

[[codex.replace]]
path = 'skills/reflect/SKILL.md'
find = '''- `new skill via skill-creator: <kebab-name>`: hand creation to `skill-creator`, and place the new skill where both harnesses discover it, per [harnesses.md](../poteto-mode/references/harnesses.md) (Skills). Do not invent the shape ad hoc.'''
replace = '''- `new skill via skill-creator: <kebab-name>`: hand creation to `skill-creator`, and place the new skill where both harnesses discover it, per [harnesses.md](../poteto-mode/references/harnesses.md) (Skills). Do not invent the shape ad hoc.
- A Check cell that names a check: build the check and its test in the repository that runs it, in the same release as the row's text, and list the check in step 6's summary beside the edit.'''

[[codex.replace]]
path = 'skills/reflect/references/synthesizer.md'
find = '''For each item, describe the pattern, what was hit, and the suggested mechanism.'''
