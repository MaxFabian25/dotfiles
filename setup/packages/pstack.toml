# Four ideas from Matt Pocock's skills that the user chose to fold into pstack on 2026-11-15, after a reading of
# all of them against the adapted pstack: reflect's environment lens (Matt's retro), hard bugs built to the owned
# diagnosing-bugs skill's loop, writing-for-agents beside skill-creator, and questions asked in rounds (Matt's
# grilling). Like the reflect rules above, they are the user's own choices, so they sit here and not in the
# adaptation.
[[codex.replace]]
path = 'skills/reflect/references/tooling-reviewer.md'
find = '''Read the active transcript at <ABSOLUTE_PATH> (or use the digest below if no path is given).'''
replace = '''## Lens addition: environment

Flag each place where the repository or setup, not a skill, cost the session time or let a mistake through. Read the repository's check command and CI workflow before you call a check missing. Look for:
- a fact the agent hunted for that one pointer line in the repository's agent instructions would have given
- a mistake that an existing check missed, or that a lint, type check, test or CI job would catch, and a repository with no such check at all
- a judgment call that belongs in the standards file a reviewer reads
- an always-loaded instruction that changes nothing, repeats another, or should be a check
- an expensive tool call that a script or flag would cut
- a log, database or service view the agent needed and lacked

Route each as `environment: <repository-relative path>`, naming the file to change or the check to add.

Read the active transcript at <ABSOLUTE_PATH> (or use the digest below if no path is given).'''

[[codex.replace]]
path = 'skills/reflect/references/tooling-reviewer.md'
find = '''Drop any skill that was neither invoked nor a missed-trigger candidate.'''
replace = '''Drop any skill that was neither invoked nor a missed-trigger candidate. A finding from the environment lens needs no skill use. It routes to a file in the repository the session worked in.'''

[[codex.replace]]
path = 'skills/reflect/references/tooling-reviewer.md'
find = '''OR "new skill: <kebab-name>".'''
replace = '''OR "new skill: <kebab-name>", OR `environment: <repository-relative path>` for a finding from the environment lens.'''

[[codex.replace]]
