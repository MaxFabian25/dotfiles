[codex]
install = [{ via = "personal", enabled = true }]
adaptation = { repository = "https://github.com/MaxFabian25/pstack-harness-adaptations.git", base = "7ef5949aaca808ec4951124deb4608d45259ac72", adapted = "5bc4fe1787b850fd2ef976fcf0dadd6688b7bea0", harness = "skills/poteto-mode/references/harnesses.md" }

# Three ideas from Matt Pocock's skills that the user chose to fold into pstack on 2026-11-15: hard bugs built to
# the owned diagnosing-bugs skill's loop, writing-for-agents beside skill authoring, and questions asked in rounds
# (Matt's grilling). They are the user's own choices, so they sit here and not in the adaptation. The user's
# reflect rules of 2026-11-14 and 2026-11-15 (a finding's text and check in one row, and the environment lens)
# ended with Pstack 0.15.43, whose single-pass reflect the user took as upstream wrote it on 2026-11-17.
[[codex.replace]]
path = 'skills/poteto-mode/playbooks/bug-fix.md'
find = '''Trace every caller and the arguments it passes before you call the flagged code reachable or unreachable.'''
replace = '''Trace every caller and the arguments it passes before you call the flagged code reachable or unreachable. When the bug resists a first look, comes and goes, or appeared between two known states, build the loop to the **diagnosing-bugs** skill's Phase 1 completion criterion, one command you have already run that goes red on this bug, and minimise the repro per its Phase 2 before step 2.'''

[[codex.replace]]
path = 'skills/poteto-mode/playbooks/bug-fix.md'
find = '''When program state is unclear, add instrumentation or logging and read it as the code runs.'''
replace = '''When program state is unclear, add instrumentation or logging and read it as the code runs. Tag every debug log with one prefix, such as `[DEBUG-a4f2]`, so that one grep removes them all before the fix ships.'''

[[codex.replace]]
path = 'skills/poteto-mode/playbooks/authoring-a-skill.md'
find = '''1. Use the authoring route in [harnesses.md](../references/harnesses.md) (Skill authoring and description tuning).'''
replace = '''1. Use the authoring route in [harnesses.md](../references/harnesses.md) (Skill authoring and description tuning), and word the text per the **writing-for-agents** skill.'''

[[codex.replace]]
path = 'skills/poteto-mode/SKILL.md'
find = '''- Prose, your reply included → **unslop**.'''
replace = '''- Prose, your reply included → **unslop**. Agent-facing prose, such as a skill or agent instructions, also follows the **writing-for-agents** skill.'''

[[codex.replace]]
path = 'skills/poteto-mode/SKILL.md'
find = '''Ask it through the question tool (Claude Code `AskUserQuestion`, Codex `request_user_input`) when the host has one.'''
replace = '''Ask it through the question tool (Claude Code `AskUserQuestion`, Codex `request_user_input`) when the host has one. When several calls for the user remain, ask them in rounds. Put every call whose prerequisites are settled in one question-tool call, each with your recommended answer, and hold a call that depends on an answer still open for the next round.'''

[[codex.replace]]
path = 'skills/unslop/SKILL.md'
find = '''Scan for the patterns below, then rewrite. Preserve meaning and match the intended tone.'''
replace = '''Scan for the patterns below, then rewrite. Preserve meaning and match the intended tone. When the **prose** skill or a project style guide is active, follow it for punctuation, quotation marks, headings, and register.'''

[[codex.replace]]
path = 'skills/unslop/SKILL.md'
find = '''11. One name per thing. Repeat it.'''
replace = '''11. One name per thing. Keep the term consistent without opening consecutive sentences with the same subject noun when a clear pronoun or clause works.'''

[[codex.replace]]
path = 'skills/principle-explain-the-number/SKILL.md'
find = '''description: "Apply before you measure, before you price a workaround for a limit you hit, and before you trust, report, or act on a number you measured: a speedup, a regression, a throughput, a latency, an eval result, or a score or ranking from a panel of agents, and before you repeat a count copied from a dashboard, push banner or alert API. Also apply before you choose a cap, limit or setting from measurements, and before you put a size, saving or cost figure in a question for the user's approval. Also apply to search hit counts and classifier bucket totals: all zeros needs a known-positive query, and a residual bucket needs a sample opened. For a limit you hit, read the tool's config schema or source at the installed version first, because a limit is a setting until those say otherwise. Find what limits it, and rule out that it measured something other than the work you think."'''
replace = '''description: "Apply before you measure, price a workaround for a limit you hit, or trust, report or act on a measured number, such as a speedup, latency, eval result or a panel's score, and before you repeat a count from a dashboard, push banner or alert API. Also apply before you choose a cap or setting from measurements or put a size, saving or cost in a question for approval, and to search hit counts and classifier buckets: all zeros needs a known-positive query, and a residual bucket needs a sample opened. For a limit you hit, read the tool's config schema or source at the installed version first. Find what limits the number, and rule out that it measured other work."'''

[[codex.replace]]
path = 'skills/principle-build-the-lever/SKILL.md'
find = '''description: "Apply to any non-trivial work, not just bulk work: edits, migrations, analyses, checks. Build the tool that does it or proves it (codemod, script, generator, or a skill your subagents follow) instead of working by hand. The tool is the artifact a reviewer can rerun. Also apply when you are about to paste the same shell loop, snippet or check a second time, and before you defer, drop or shrink work because doing it by hand would be slow or risky: look for a tool the repository already has, or build one."'''
replace = '''description: "Apply to any non-trivial work, such as edits, migrations, analyses and checks: build the tool that does it or proves it, such as a codemod, script, generator or a skill your subagents follow, so a reviewer can rerun it. Also apply before you paste the same shell loop, snippet or check a second time, and before you defer, drop or shrink work because doing it by hand would be slow or risky: look for a tool the repository already has, or build one."'''

