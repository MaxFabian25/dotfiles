public = true

[source]
repo = "skills"

[skills]
on = ["show-me"]
tool_notes = "apply"

[codex]
install = [{ via = "personal", enabled = true }, { via = "skills", enabled = false }]

[[codex.replace]]
path = 'skills/show-me/SKILL.md'
find = '''- For a visual UI, layout, state comparison, or concept too dense for Mermaid, write one focused HTML file — a diagram, an infographic, or a short slide deck, whichever fits the point. Match the product's colors, type, spacing, and components; use real labels and data; support desktop and mobile. Then open it for the user:

```
Bash(open path/to/show-me-{description}.html)
```'''
replace = '''- For a visual UI, layout, state comparison, or concept too dense for Mermaid, write one focused HTML file — a diagram, an infographic, or a short slide deck, whichever fits the point. Prefer one progressive interactive view over a crowded all-in-one diagram. Match the product's colors, type, spacing, and components; use real labels and data; support desktop and mobile. In T3 Code, check it with `html_preview` and show it with `html_render`; if two `html_preview` calls time out, render a local screenshot with headless Chromium (`DISPLAY=` unset on WSL) and inspect that PNG before calling `html_render`. Outside T3 Code, open the file for the user (`open path/to/show-me-{description}.html`).'''

[claude]
install = [{ via = "skills", enabled = true }]

[[claude.replace]]
path = 'skills/show-me/SKILL.md'
find = '''- For a visual UI, layout, state comparison, or concept too dense for Mermaid, write one focused HTML file — a diagram, an infographic, or a short slide deck, whichever fits the point. Match the product's colors, type, spacing, and components; use real labels and data; support desktop and mobile. Then open it for the user:

```
Bash(open path/to/show-me-{description}.html)
```'''
replace = '''- For a visual UI, layout, state comparison, or concept too dense for Mermaid, write one focused HTML file — a diagram, an infographic, or a short slide deck, whichever fits the point. Prefer one progressive interactive view over a crowded all-in-one diagram. Match the product's colors, type, spacing, and components; use real labels and data; support desktop and mobile. In T3 Code, check it with `html_preview` and show it with `html_render`; if two `html_preview` calls time out, render a local screenshot with headless Chromium (`DISPLAY=` unset on WSL) and inspect that PNG before calling `html_render`. Outside T3 Code, open the file for the user (`open path/to/show-me-{description}.html`).'''
