[[tool_note]]
match = "\\bAskUserQuestion tool\\b"
note = " (Codex: `request_user_input`)"

[[tool_note]]
match = "\\bSkill tool\\b"
note = " (Claude Code and Codex: open the named skill's `SKILL.md`)"

[[tool_note]]
match = "\\bTask tool\\b"
note = " (Codex: `spawn_agent`)"

[[tool_note]]
match = "\\bAgent\\(\\) or Task\\(\\)"
note = " (Codex: `spawn_agent`)"

[[tool_note]]
match = "\\bExplore agent(?:/tool)?"
note = " (Codex: `spawn_agent` with `agent_type` `explorer`)"

[[tool_note]]
match = "\\bTodoWrite\\b"
note = " (Codex: `update_plan`)"

[[tool_note]]
match = "\\bWebSearch\\b"
note = " (Codex: the web tool's `search_query`)"

[[tool_note]]
match = "\\bWebFetch\\b"
note = " (Codex: the web tool's `open`)"

[[tool_note]]
match = "\\bHelp the user understand the current topic of conversation visually\\."
note = " In a T3 Code session, a Mermaid block in your reply shows as code rather than a diagram, and `open` shows nothing, so draw a diagram or visual as HTML and show it with `html_preview` and then `html_render`."

[[tool_note]]
match = "\\bWhen the design hook is active"
note = " (it sees only edits made with the file-edit tools, so after an edit through the shell, run `scripts/impeccable detect --json <file>` on the shipped file before you report a pass)"

[[tool_note]]
match = "\\bexcept assets the user must provide\\."
note = " The deliverable's words count too: before you write or change any text on the page, load the `unslop` skill, and the `prose` skill for English or Danish house style."
