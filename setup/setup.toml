public = true
public_repositories = [
  "https://github.com/MaxFabian25/pstack-harness-adaptations.git",
  "https://github.com/anthropics/financial-services.git",
  "https://github.com/anthropics/skills.git",
  "https://github.com/cursor/plugins.git",
  "https://github.com/emilkowalski/skills.git",
  "https://github.com/humanlayer/skills.git",
  "https://github.com/jakubkrehel/skills.git",
  "https://github.com/mattpocock/skills.git",
  "https://github.com/nateherkai/scroll-craft.git",
  "https://github.com/openai/codex-plugin-cc.git",
  "https://github.com/pbakaus/impeccable.git",
  "https://github.com/shadcn/improve.git",
  "https://github.com/vercel/next.js.git",
  "https://github.com/warpdotdev/claude-code-warp.git",
