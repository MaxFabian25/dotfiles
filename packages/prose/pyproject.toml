[project]
name = "prose-development"
version = "0.0.0"
requires-python = ">=3.10"

[dependency-groups]
dev = ["markdown-it-py==4.2.0", "ruff==0.16.6"]

[tool.uv]
package = false

[tool.ruff]
target-version = "py310"
include = ["*.py"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pyright]
pythonVersion = "3.10"
typeCheckingMode = "off"
include = ["scripts", "tests"]
exclude = ["**/__pycache__"]
extraPaths = ["scripts"]
