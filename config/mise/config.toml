[tools]
go = "1.27.3"
node = "26.13.0"
# postinstall runs only when mise installs this Python, so a pin change keeps xlwings importable.
python = { version = "3.14.10", postinstall = "python -m pip install xlwings==0.37.8" }
java = "27.0.0"
dotnet = "10.0.403"
gh = "2.103.3"
op = "2.42.0"
jq = "1.8.2"
rg = "15.2.0"
fd = "10.5.1"
fzf = "0.74.5"
bat = "0.26.1"
delta = "0.20.1"
just = "1.59.0"
actionlint = { version = "1.7.12", os = ["linux", "macos"] }
kubectl = "1.37.2"
docker-cli = "29.9.3"
docker-compose = "5.7.0"
uv = "0.13.7"
pnpm = "12.18.0"
"npm:@yarnpkg/cli-dist" = "4.18.1"
"npm:npm" = "12.2.2"
"npm:@openai/codex" = "0.169.0-alpha.6"
"npm:agent-browser" = "0.42.0"
powershell = { version = "7.6.9", os = ["macos"] }
# bun does not read ~/.npmrc, so each machine sets the same three-day limit as minimumReleaseAge in ~/.bunfig.toml.
bun = "1.4.4"
supabase = "3.0.0"
"npm:portless" = "0.16.0"
"npm:ctx7" = "0.9.0"
"npm:impeccable" = "4.8.1"
stripe = "1.55.8"
"npm:playwright" = "1.64.1"
"npm:appium" = { version = "3.9.0", os = ["macos"] }
"npm:pyright" = "1.1.414"
"npm:typescript" = "7.0.2"
"npm:typescript-language-server" = "6.0.3"
"npm:@devcontainers/cli" = "0.90.0"

# Keep the selected npm ahead of Node's bundled npm, including after directory changes.
# mise resolves an empty entry to config_root, the home folder here, so the else branch names a missing folder.
[env._.path]
path = ['{% if tools["npm:npm"] %}{{ tools["npm:npm"].path }}/node_modules/.bin{% else %}{{ config_root }}/.config/mise/npm-not-installed{% endif %}']
tools = true
