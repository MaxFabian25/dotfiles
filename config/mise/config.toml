[tools]
go = "1.27.4"
node = "26.13.1"
# postinstall runs only when mise installs this Python, so a pin change keeps xlwings importable.
python = { version = "3.14.10", postinstall = "python -m pip install xlwings==0.37.8" }
java = "27.0.0"
dotnet = "11.0.100"
gh = "2.106.0"
op = "2.42.0"
jq = "1.8.2"
rg = "16.0.0"
fd = "10.5.2"
fzf = "0.75.0"
bat = "0.26.1"
delta = "0.22.0"
just = "1.59.0"
actionlint = { version = "1.7.12", os = ["linux", "macos"] }
kubectl = "1.37.3"
docker-cli = "29.10.1"
docker-compose = "5.8.0"
uv = "0.13.10"
pnpm = "12.23.0"
"npm:@yarnpkg/cli-dist" = "4.19.0"
"npm:npm" = "12.2.3"
"npm:@openai/codex" = "0.174.0-alpha.7"
"npm:agent-browser" = "0.45.0"
opencode = { version = "2.4.2", allow_builds = ["@opencode/cli"] }
powershell = { version = "7.6.9", os = ["macos"] }
# bun does not read ~/.npmrc, so config/bun/bunfig.toml gives it the same one-day limit as minimumReleaseAge.
bun = "1.4.5"
supabase = "3.4.0"
"npm:portless" = "0.18.1"
"npm:ctx7" = "0.13.0"
"npm:impeccable" = "4.10.0"
stripe = "1.55.15"
"npm:playwright" = "1.65.1"
"npm:appium" = { version = "3.9.0", os = ["macos"] }
"npm:pyright" = "1.1.414"
"npm:typescript" = "7.0.2"
# @effect/tsgo tracks npm:typescript (7.0.2); bump the pair together.
"npm:@effect/tsgo" = "0.73.7"
"npm:typescript-language-server" = "6.1.0"
"npm:@devcontainers/cli" = "0.91.0"

# Keep the selected npm ahead of Node's bundled npm, including after directory changes.
# mise resolves an empty entry to config_root, the home folder here, so the else branch names a missing folder.
[env._.path]
path = ['{% if tools["npm:npm"] %}{{ tools["npm:npm"].path }}/node_modules/.bin{% else %}{{ config_root }}/.config/mise/npm-not-installed{% endif %}']
tools = true
